<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わたしのプロフィール</title>
    <!-- cssファイルを読み込む -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- プロフィール全体を囲む箱 -->
    <div class="profile-card">
        
        <!-- 名前 -->
        <h1>山田 太郎</h1>
        
        <!-- プロフィール画像 -->
        <!-- imagesフォルダ内の好きな画像に変更してみましょう -->
        <img src="images/profile.jpg" alt="プロフィール画像" class="profile-img">
        
        <!-- 自己紹介文 -->
        <h2>自己紹介</h2>
        <p>はじめまして。Webデザインを勉強中です！<br>
           これからHTMLとCSSを頑張ります。</p>

        <!-- 趣味のリスト -->
        <h2>好きなこと・趣味</h2>
        <ul>
            <li>ゲームをすること</li>
            <li>音楽を聴くこと</li>
            <li>美味しいものを食べること</li>
        </ul>

    </div>

</body>
</html>
