<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <!-- グーグルフォントの読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <!-- 自分が書いたものを読みこう場合は下側に置く -->
    <link rel="stylesheet" href="css/style.css">
    
</head>
<body>
    <header>
        <div class="contenainer header-inner"><!-- div  = 意味を持たずcssで利用するためのクラスなどをつけるタグ 二つのクラスを持たせている-->
            <h1>
                <img src="img/logo.svg" alt="Profile">
            </h1>
            <nav>
                <ul>
                    <li><a href="#about">About</a></li>
                    <li><a href="#bicycle">Bicycle</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <img class="mainvisual"  src="img/mainvisual.jpg" alt="メインビジュアル">
        <section id="about">
            <div class="contenainer">
                <h2>About</h2>
                <div class="about-contents">
                    <img src="img/about.jpg" alt="緑帽子の男のアイコン" class="about_img">
                    <!-- 名前と自己紹介を -->
                    <div class="about-text">
                        <h3 class="about_name">Kakeru Miyaiti</h3>
                        <p>テキストテキストテキストテキストテキストテキストテキスト<br>
                            テキストテキストテキストテキストテキストテキス<br>テキストテキストテキストテキストテキストテキストテキスト
                        </p>
                    </div>
                </div>
            </div>
        </section>
        <!-- id属性でページ内リンクを作る-->
        <section id="bicycle">
            <div class="contenainer">
                <h2>Bicycle</h2>
                
                <ul class="biycycle_list">
                    <li>
                        <img src="img/bicycle1.jpg" alt="黒い自転車">
                        <h3>タイトルタイトル</h3>
                        <p>テキストテキストテキスト</p>
                    </li>
                    <li>
                        <img src="img/bicycle2.jpg" alt="シルバーの自転車">
                        <h3>タイトルタイトル</h3>
                        <p>テキストテキストテキスト</p>
                    </li>                
                    <li>
                        <img src="img/bicycle3.jpg" alt="白い自転車">
                        <h3>タイトルタイトル</h3>
                        <p>テキストテキストテキスト</p>
                    </li>
                </ul>
            </div>
        </section>

    </main>
    <footer>
        <small>&copy; 2020 Profile</small>
    </footer>
    
</body>
</html>
