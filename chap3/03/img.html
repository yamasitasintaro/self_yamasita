<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像を表示するタグ</title>
</head>
<body>
    <h1>画像を表示するタグ</h1>
    <!-- srcソース属性　altオルト属性 -->
    <figure><img src="horse.jpg" alt="走る白馬"></figure>
    <figcaption>〇〇県で４/２７に撮影された白馬の様子</figcaption>
</body>
</html>
