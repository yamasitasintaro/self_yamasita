<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表を作るタグ</title>
</head>
<body>
    
    <h1>表を作るタグ</h1>
    <table border="1">
    <!-- 表の見出し -->
    <!-- １行目 -->
     <thead>
      <tr>
        <th>アイテム名</th>
        <th>種類</th>
        <th>レア度</th>
      </tr>
     </thead>
    <!--  表のデータ-->
    <!-- 二行目 -->
     <tbody>
       <tr>
        <td>ひのきのつるぎ</td>
        <td>武器</td>
        <td>⭐︎</td>
       </tr> 
    <!-- 3行目 -->
       <tr>
        <td>猫のお守り</td>
        <td>防具</td>
        <td>⭐︎⭐︎</td>
       </tr> 
    <!-- 4行目 -->
       <tr>
        <td>不思議なりんご</td>
        <td>消耗品</td>
        <td>⭐︎⭐︎⭐︎</td>
       </tr>
    <!-- ５行目 -->
       <tr>
        <td>空飛ぶブーツ</td>
        <td>装備</td>
        <td>⭐︎⭐︎⭐︎⭐︎</td>
       </tr>
     </tbody>
    </table>

    <table border="1">
        <thead>
            <tr>
                <!-- column... 列 -->
                <th colspan="3">葬送のフリーレン パーティメンバー</th>
            </tr>
            <tr>
                <th>パーティ</th>
                <th>名前</th>
                <th>職業</th>
            </tr>    
        </thead>
        <tbody>
            <tr>
                <td rowspan="4">ヒンメル一行</td>
                <td>ヒンメル</td>
                <td>勇者</td>
            </tr>
            <tr>
                <td>フリーレン</td>
                <td>魔法使い</td>
            </tr>
            <tr>
                <td>アイゼン</td>
                <td>戦士</td>
            </tr>
                <td>ハイター</td>
                <td>僧侶</td>
        
    <table border="1">
        <thead>
            <tr>
                <th rowspan="4">フリーレン一行</th>
                <th>フリーレン</th>
                <th>魔法使い</th>
            </tr>
            <tr>
                <th>フェルン</th>
                <th>魔法使い</th>
            </tr>
            <tr>
                <th>シュタルク</th>
                <th>戦士</th>
            </tr>
            <tr>
                <th>ザイン</th>
                <th>僧侶</th>
            </tr>
        </thead>






    </table>
            </tbody>    
    </table>


</body>
</html>
