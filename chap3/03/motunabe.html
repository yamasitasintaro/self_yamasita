    <h1>モツ鍋とは？</h1>
    <p>モツ鍋は、牛や豚のホルモン（モツ）を使った日本の鍋料理です。特に福岡で有名です。</p>

    <h2>モツ鍋の特徴</h2>

    <h3>スープの種類</h3>
    <p>醤油味、味噌味、塩味などさまざまな種類があります。</p>

    <h3>具材</h3>
    <p>モツのほかに、キャベツ、ニラ、にんにくなどがよく使われます。</p>

    <h2>モツ鍋の魅力</h2>

    <h3>栄養が豊富</h3>
    <p>モツにはコラーゲンやビタミンが多く含まれています。</p>

    <h3>締めまで楽しめる</h3>
    <p>最後にちゃんぽん麺や雑炊を入れて、スープを最後まで楽しめます。</p>
