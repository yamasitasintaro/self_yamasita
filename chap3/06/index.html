<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>応用的なセレクタ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>応用的なセレクタ</h1>
    <section class="sec1">
        <h2>子孫セレクタ、子セレクタ、兄弟セレクタ</h2>
        <div class="div1">
            <p>div1の直下のp</p>
            <div class="div2">
                <h3>div2直下のh3</h3>
                <p>div2の直下のp</p>
                <p>div2の直下のp</p>
                <p>div2の直下のp</p>
                <p>div2の直下のp</p>
                <p>div2の直下のp</p>
            </div>
        </div>
        <p>sec1直下のp</p>
    </section>
    <section class="sec2">
        <h2>擬似クラス</h2>
        <p>要素の状態や位置をもとにスタイルを変更する時に使う</p>
        <form action="#" method="post">
            <p>
                <label for="name">お名前</label>
                <input type="text" name="name" id="name" required>
            </p>
            <p>
                <input type="checkbox" name="check" id="check">
                <label for="check">利用規約に同意します</label>
            </p>
            <p>
                <input type="submit" value="送信する">
                <button type="button" disabled>キャンセル
                </button>
            </p>
        </form>
    </section>
    <section class="sec3">
        <h2>構造関連の擬似クラスと擬似要素</h2>
        <ul>
            <li>item1</li>
            <li>item2</li>
            <li>item3</li>
            <li>item4</li>
            <li>item5</li>
        </ul>
        <!-- ol>li{item$}*5 -->
        <ol>
            <li>item1</li>
            <li>item2</li>
            <li>item3</li>
            <li>item4</li>
            <li>item5</li>
        </ol>
        </section>
</body>
</html>
