<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>idとお知らせ</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <!-- id はページ内の一つだけの要素につける名前 -->
    <h1 id="title">おしらせ</h1>
    <p>次のセミナーについてお知らせします。</p>
<!-- class　は同じ役割の要素たちをまとめて扱うためのラベル -->
    <p class="note">内容：HTMLとCSSの基礎</p>
    <p class="note">日時：５月１０　（金）１８：００　ー　２０：００</p>
    <p class="note">場所：　オンライン</p>
    <p class="note inportant">申込期限は金曜日です。</p>
    <a href="#" class="btn">申し込み</a>

</body>
</html>
