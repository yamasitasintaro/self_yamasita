<!DOCTYPE html>
<!-- 属性　タグに追加する捕捉情報 -->
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>見出しタグ</title>
</head>
<body>
    <h1>一番大きな見出し</h1>
    <h2>二番目に大きな見出し</h2>
    <h3>三番目に大きな見出し</h3>
</body>
</html>
